# Compose para ambiente de PRODUÇÃO do backend.
# Sobe PostgreSQL + Spring Boot.
#
# O frontend é deployado de forma independente no próprio repositório agro-frontend.
#
# Uso:
#   cp .env.example .env.prod   # editar com valores reais
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Ver DEPLOYMENT.md para detalhes.

name: agro-backend-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: agro-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    networks: [agro-net]
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agro-backend:latest
    container_name: agro-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    networks: [agro-net]
    logging: *default-logging

networks:
  agro-net:
    driver: bridge

volumes:
  postgres_data_prod:
