spring.application.name=agro-backend
spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME:agro_backend}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}

app.seed.admin.enabled=${APP_SEED_ADMIN_ENABLED:false}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@admin.com}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Actuator roda em porta separada (9090), não exposta externamente.
# Assim o healthcheck do Docker acessa internamente sem precisar de auth,
# e a porta 8080 (API) mantém /actuator/health protegida pelo Spring Security.
management.server.port=9090

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Analytics MV Refresh
app.analytics.refresh.enabled=true
app.analytics.refresh.interval-ms=300000

# Anexos fotográficos (Feature 3.9)
#
# O padrão do Spring é 1 MB por arquivo, abaixo do que uma foto comprimida de
# celular costuma ocupar — sem isto o upload falharia antes de chegar à
# validação. O teto de 5 MB espelha o CHECK da migration V15; o da requisição
# acomoda o envelope multipart em volta do binário.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
