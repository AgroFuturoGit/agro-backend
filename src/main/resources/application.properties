spring.application.name=agro-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME:agro_backend}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Actuator roda em porta separada (9090), não exposta externamente.
# Assim o healthcheck do Docker acessa internamente sem precisar de auth,
# e a porta 8080 (API) mantém /actuator/health protegida pelo Spring Security.
management.server.port=9090
