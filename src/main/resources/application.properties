spring.application.name=agro-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agro_backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:agro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agro}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
