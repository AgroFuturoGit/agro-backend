name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

env:
  TZ: America/Sao_Paulo

jobs:
  validate-branch-flow:
    name: Validar Fluxo de Branches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checar PR para Staging
        if: github.base_ref == 'staging' && github.head_ref != 'develop'
        run: |
          echo "ERRO: PRs para a branch 'staging' só podem vir de 'develop'."
          exit 1

      - name: Checar PR para Main
        if: github.base_ref == 'main' && github.head_ref != 'staging' && !startsWith(github.head_ref, 'hotfix/')
        run: |
          echo "ERRO: PRs para a branch 'main' só podem vir de 'staging' ou 'hotfix/*'."
          exit 1

  build-and-test:
    name: Build e Testes
    needs: validate-branch-flow
    if: always() && (needs.validate-branch-flow.result == 'success' || needs.validate-branch-flow.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: ./mvnw -B package -DskipTests

      - name: Testes
        run: ./mvnw -B test
